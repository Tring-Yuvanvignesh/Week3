<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tringapps Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="https://fonts.cdnfonts.com/css/rajdhani" rel="stylesheet">
    <script src="script.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            height: 100vh;
        }
        
        .container {
            width: 50%;
            background-color: #222;
            color: white;
            padding: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            height: 100vh;
        }

        .inside{
            top: 225.5px;
            position: relative;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #292929;
        }

        ::-webkit-scrollbar-thumb {
            background: #FFFFFF33; 
            border-radius: 10px;
        }

        .navbar {
            width: 100%;
            background-color: #222;
            z-index: 1050;
            width: 45%;
            padding: 15px 30px;
        }

        .switch-buttons {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .switch-buttons button {
            font-family: Rajdhani;
            font-weight: 600;
            padding-top: 10px;
            padding-right: 20px;
            padding-bottom: 10px;
            padding-left: 20px;
            gap: 10px;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .switch-buttons .active {
            background: #EBA832;
            color: white;
        }
        .switch-buttons .inactive {
            background: #FFFFFF1A;
            color: #FFFFFF1A;
        }
        .container label {
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
        }
        .container input, .container select{
            background: #292929;
            border: 1px solid #FFFFFF33;
            width: 100%;
            padding-top: 12px;
            padding-left: 16px;
            padding-right: 16px;
            padding-bottom: 12px;
            margin-bottom: 15px;
            background: #333;
            border: none;
            color: #FFFFFF80;
            border: 1px solid #FFFFFF33
        }

        .container input::placeholder {
            color: #bbb;
        }

        .phone-input {
            display: flex;
            gap: 10px;
        }
        .phone-input select {
            color: white;
            width: 30%;
        }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }   

        .container .checkbox {
            display: flex;
            justify-content: space-between;
            flex-direction: column;
            width: 100%;
        }
        .container .checkbox input {
            width: auto;
            margin-right: 5px;
            background: #292929;
        }

        .container .submit-btn {
            font-family: Open Sans;
            font-weight: 600;
            font-size: 16px;
            line-height: 21.79px;
            letter-spacing: 0px;
            width: 100%;
            background: #EBA832;
            padding-top: 11px;
            padding-right: 38px;
            padding-bottom: 11px;
            padding-left: 38px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin-top: 25px;
            line-height: 21.79px;
        }

        .hori_line {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .hori_line p {
            margin: 0;
        }

        .container .google-btn {
            margin-top: 16px;
            gap: 8px;
            width: 100%;
            background: #FFFFFF;
            padding: 11px;
            border: none;
            color: black;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #1111111A

        }

        .container .signin {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
        .container .signin a {
            color: #EBA832;
            text-decoration: none;
        }
        .right-section {
            width: 50%;
            display: flex;
            background-color: #000;
        }
        .right-section img {
            max-width: 100%;
            max-height: 100%;
        }

    </style>
</head>
<body>
    
    <div class="container">

        <nav class="navbar navbar-light fixed-top p-3 px-md-5">
            <a class="navbar-brand" href="#">
                <img src="./images/logo.png" width="150" height="32.85" alt="logo">
            </a>
        </nav>

        <div class="inside">
        <div class="switch-buttons">
            <button class="inactive" onclick="signIn()">Sign In</button>
            <button class="active">Sign Up</button>
        </div>

        <label for="text">Your Name<span style="color:#CC1E4F;">*</span></label>
        <input placeholder="Enter your name">

        <label for="email">Email<span style="color:#CC1E4F;">*</span></label>
        <input type="email" placeholder="Enter email">

        <label>Languages</label>
        <select>
            <option selected>Select an option</option>
            <option>English</option>
            <option>Spanish</option>
            <option>French</option>
        </select>

        <label>Phone Number</label>
        <div class="phone-input">
            <select>
                <option>+1</option>
                <option>+91</option>
                <option>+44</option>
            </select>
            <input type="number" placeholder="Phone number">
        </div>

        <label for="password">Password</label>
        <div>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <div class="checkbox">
            <div class="d-flex align-items-center">
                <label for="remember-me" class="remember-me"><input type="checkbox">Remember me</label>
            </div>
            <div class="d-flex align-items-center">
                <label for="terms" class="remember-me"><input type="checkbox">I agree to the <span style="color:#EBA832;">Terms <span style="color: white;">and</span> Privacy Policy</span></label>
            </div>
            <div class="d-flex align-items-center">
                <label for="18+" class="remember-me"><input type="radio">I'm over 18+</label>
            </div>
        </div>

        <button class="submit-btn">Submit</button>

        <div class="hori_line">
            <hr style="width: 50%;">
            <p>OR</p>
            <hr style="width: 50%;">
        </div>

        <button class="google-btn">Sign In with <img src="./images/google_logo.png" alt=""></button>

        <p class="signin">Have an account? <a href="./signIn.html">Sign In</a></p>

    </div>
</div>
    <div class="right-section">
        <img src="./images/signup_backgroung.png" alt="img">
    </div>
</body>
</html>
