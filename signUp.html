<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tringapps Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="https://fonts.cdnfonts.com/css/rajdhani" rel="stylesheet">
    <script src="script.js"></script>
    <link rel="stylesheet" href="./signUpStyle.css">
</head>
<body>
    
    <div class="container">

        <nav class="navbar navbar-light fixed-top p-3 px-md-5">
            <a class="navbar-brand" href="#">
                <img src="./images/logo.png" width="150" height="32.85" alt="logo">
            </a>
        </nav>

        <div class="inside">
        <div class="switch-buttons">
            <button class="inactive" onclick="signIn()">Sign In</button>
            <button class="active">Sign Up</button>
        </div>

        <label for="text">Your Name<span style="color:#CC1E4F;">*</span></label>
        <input placeholder="Enter your name" id="signUp-name">

        <label for="email">Email<span style="color:#CC1E4F;">*</span></label>
        <input type="email" placeholder="Enter email" id="signUp-email">

        <label>Languages</label>
        <select>
            <option selected>Select an option</option>
            <option>English</option>
            <option>Spanish</option>
            <option>French</option>
        </select>

        <label>Phone Number</label>
        <div class="phone-input">
            <select>
                <option>+1</option>
                <option>+91</option>
                <option>+44</option>
            </select>
            <input type="number" placeholder="Phone number">
        </div>

        <label for="password">Password</label>
        <div>
            <input type="password" id="signUp-password" placeholder="Enter password">
        </div>

        <div class="checkbox">
            <div class="d-flex align-items-center">
                <label for="remember-me" class="remember-me"><input type="checkbox">Remember me</label>
            </div>
            <div class="d-flex align-items-center">
                <label for="terms" class="remember-me"><input type="checkbox">I agree to the <span style="color:#EBA832;">Terms <span style="color: white;">and</span> Privacy Policy</span></label>
            </div>
            <div class="d-flex align-items-center">
                <label for="18+" class="remember-me"><input type="radio">I'm over 18+</label>
            </div>
        </div>

        <button class="submit-btn" id="signUp-submit">Submit</button>

        <div class="hori_line">
            <hr style="width: 50%;">
            <p>OR</p>
            <hr style="width: 50%;">
        </div>

        <button class="google-btn" >Sign In with <img src="./images/google_logo.png" alt=""></button>

        <p class="signin">Have an account? <a href="./signIn.html">Sign In</a></p>

    </div>
</div>
    <div class="right-section">
        <img src="./images/signup_backgroung.png" alt="img">
    </div>
</body>
</html>
