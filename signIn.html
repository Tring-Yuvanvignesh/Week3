<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tringapps Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="https://fonts.cdnfonts.com/css/rajdhani" rel="stylesheet">
    <script src="script.js"></script>
    <link rel="stylesheet" href="./signInStyle.css">
</head>
<body>
    <nav class="navbar navbar-light fixed-top p-3 px-md-5">
        <a class="navbar-brand" href="#">
            <img src="./images/logo.png" width="150" height="32.85" alt="logo">
        </a>
    </nav>
    <div class="container">
        <div class="switch-buttons">
            <button class="active" id="signIn">Sign In</button>
            <button class="inactive" id="signUp" onclick="signUp()">Sign Up</button>
        </div>
        <label for="email">Your Email<span style="color:#CC1E4F;">*</span></label>
        <input type="email" id="email" placeholder="Enter email">
        <label for="password">Your Password<span style="color:#CC1E4F;">*</span></label>
        <div>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <div class="checkbox">
            <div>
                <label><input type="checkbox">Remember-me</label>
            </div>
            <span class="forgot"><a href="#">Forgot Password?</a></span>
        </div>
        <button class="submit-btn" id="signIn-submit">Submit</button>
        <div class="hori_line">
            <hr style="width: 50%;">
            <p>OR</p>
            <hr style="width: 50%;">
        </div>
        <button class="google-btn">Sign In with <img src="./images/google_logo.png" alt=""></button>
        <p class="signup">Don’t have an account? <a href="./signUp.html">Sign Up</a></p>
    </div>
    <div class="right-section">
        <img src="./images/login_background.png" alt="img">
    </div>
</body>
</html>
